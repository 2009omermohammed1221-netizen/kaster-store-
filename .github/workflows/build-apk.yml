name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Stamp build number
        run: echo '{ "build": ${{ github.run_number }} }' > src/build.json
      - run: npx expo prebuild --platform android --no-install
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: caster-store-apk
          path: android/app/build/outputs/apk/release/*.apk
      - name: Publish download link (GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/*.apk caster-store.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Caster Store" --notes "Latest Android build" --latest
          gh release upload latest caster-store.apk --clobber
          gh release edit latest --notes "$(printf 'build %s\n%s' "${{ github.run_number }}" "$(git log -1 --pretty=%s)")"
